server:
  port: 8085
spring:
  application:
    name: workout-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/workout_db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:yourpassword}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}