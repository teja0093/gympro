server:
  port: 8082
spring:
  application:
    name: member-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/member_db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:yourpassword}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
internal:
  key: ${INTERNAL_KEY:gympro-internal-dev-key}