server:
  port: 8084
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db
    username: root
    password: ${DB_PASSWORD:yourpassword}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
razorpay:
  mock: ${RAZORPAY_MOCK:true}
  key-id: ${RAZORPAY_KEY_ID:your_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:your_key_secret}
internal:
  key: ${INTERNAL_KEY:gympro-internal-dev-key}