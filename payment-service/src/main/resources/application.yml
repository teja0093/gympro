server:
  port: 8084
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:yourpassword}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
razorpay:
  mock: ${RAZORPAY_MOCK:true}
  key-id: ${RAZORPAY_KEY_ID:your_key_id}
  key-secret: ${RAZORPAY_KEY_SECRET:your_key_secret}
internal:
  key: ${INTERNAL_KEY:gympro-internal-dev-key}