server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods: "*"
                allowedHeaders: "*"
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: member-service
              uri: lb://member-service
              predicates:
                - Path=/members/**,/plans/**
            - id: attendance-service
              uri: lb://attendance-service
              predicates:
                - Path=/attendance/**
            - id: workout-service
              uri: lb://workout-service
              predicates:
                - Path=/workouts/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
jwt:
  secret: ${JWT_SECRET:gympro-super-secret-key-change-this-1234567890}