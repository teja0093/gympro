server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: member-service
              uri: lb://member-service
              predicates:
                - Path=/members/**,/plans/**
            - id: attendance-service
              uri: lb://attendance-service
              predicates:
                - Path=/attendance/**
            - id: workout-service
              uri: lb://workout-service
              predicates:
                - Path=/workouts/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
jwt:
  secret: gympro-super-secret-key-change-this-1234567890