server:
  port: 8083
spring:
  application:
    name: attendance-service
  datasource:
    url: jdbc:mysql://localhost:3306/attendance_db
    username: root
    password: ${DB_PASSWORD:yourpassword}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka