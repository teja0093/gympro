server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:yourpassword}
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
jwt:
  secret: ${JWT_SECRET:gympro-super-secret-key-change-this-1234567890}
  expiration-ms: 86400000